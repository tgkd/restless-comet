name: RestlessComet
options:
  bundleIdPrefix: com.restlesscomet
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RestlessCore:
    path: Packages/RestlessCore
targets:
  RestlessComet:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: RestlessCore
    scheme: {}
    settings:
      configs:
        Debug:
          PRODUCT_NAME: Restless Comet Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.restlesscomet.app.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          PRODUCT_NAME: Restless Comet
          PRODUCT_BUNDLE_IDENTIFIER: com.restlesscomet.app
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      base:
        PRODUCT_MODULE_NAME: RestlessComet
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
